version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: microblog
      POSTGRES_PASSWORD: microblog
      POSTGRES_DB: microblog
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://app_user:test123@localhost:5432/microblog
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
    command: >
      sh -c "python app/create.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
